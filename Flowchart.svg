<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="1150" viewBox="0 0 1350 1150" role="img" aria-label="ALR-Bench nine-step pipeline diagram">
<title>ALR-Bench Pipeline</title><desc>Stage-attributed benchmark; reference target DOIs are held out from generation stages.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 1 L 11 6 L 0 11 Z" fill="#344E61"/></marker></defs>
<style>
text {font-family:Arial,Helvetica,sans-serif;fill:#173247}
.title {font-size:54px;font-weight:700}
.subtitle {font-size:21px}
.heading {font-size:22px;font-weight:700;fill:#fff;text-anchor:middle}
.body {font-size:20px;text-anchor:middle}
.footer {font-size:20px;text-anchor:middle}
.small {font-size:15px;fill:#506A7C}
.ico {fill:none;stroke:#173247;stroke-width:3.1;stroke-linecap:round;stroke-linejoin:round}
</style>
<rect width="1350" height="1150" fill="#FFFFFF"/>
<text x="675" y="60" text-anchor="middle" class="title">ALR-Bench Pipeline</text>
<text x="675" y="101" text-anchor="middle" class="subtitle">A stage-attributed benchmark for AI-assisted scientific review reconstruction</text>
<path d="M 430 272 H 465" stroke="#344E61" stroke-width="3.3" fill="none" stroke-linecap="square" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M 882 272 H 917" stroke="#344E61" stroke-width="3.3" fill="none" stroke-linecap="square" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M 430 608 H 465" stroke="#344E61" stroke-width="3.3" fill="none" stroke-linecap="square" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M 882 608 H 917" stroke="#344E61" stroke-width="3.3" fill="none" stroke-linecap="square" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M 430 944 H 465" stroke="#344E61" stroke-width="3.3" fill="none" stroke-linecap="square" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M 882 944 H 917" stroke="#344E61" stroke-width="3.3" fill="none" stroke-linecap="square" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M 675 412 V 446 H 223 V 465" stroke="#344E61" stroke-width="3.3" fill="none" stroke-linecap="square" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M 1127 748 V 787 H 223 V 802" stroke="#344E61" stroke-width="3.3" fill="none" stroke-linecap="square" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="1127" y="434" text-anchor="middle" class="small">Held out for evaluation</text>
<g id="stage-1"><rect x="18" y="132" width="410" height="280" rx="9" fill="#FFFFFF" stroke="#173247" stroke-width="2.3"/><path d="M 27 132 H 419 Q 428 132 428 141 V 183 H 18 V 141 Q 18 132 27 132" fill="#1178A7"/><text x="223" y="166" class="heading">Step 1: Select Reviews</text><g transform="translate(223 224)" class="ico"><circle cx="0" cy="0" r="24"/><circle cx="0" cy="0" r="13"/><circle cx="0" cy="0" r="4"/><path d="M 2 -2 L 30 -30 M 17 -29 L 30 -30 L 29 -17"/></g><text x="223" y="286" class="body"><tspan x="223" dy="0">Select 14 open-access reviews</tspan><tspan x="223" dy="28">across 8 scientific topic groups</tspan><tspan x="223" dy="28">as benchmark anchors.</tspan></text><rect x="23" y="374" width="400" height="34" fill="#EAF4F8"/><text x="223" y="398" class="footer"><tspan font-weight="700">Output:</tspan> 14 source reviews</text></g>
<g id="stage-2"><rect x="470" y="132" width="410" height="280" rx="9" fill="#FFFFFF" stroke="#173247" stroke-width="2.3"/><path d="M 479 132 H 871 Q 880 132 880 141 V 183 H 470 V 141 Q 470 132 479 132" fill="#1178A7"/><text x="675" y="166" class="heading">Step 2: Process Reviews</text><g transform="translate(675 224)" class="ico"><path d="M -18 -28 H 7 L 20 -15 V 29 H -18 Z"/><path d="M 7 -28 V -15 H 20 M -10 -6 H 11 M -10 4 H 11 M -10 14 H 8"/></g><text x="675" y="286" class="body"><tspan x="675" dy="0">Convert review PDFs to text</tspan><tspan x="675" dy="28">and extract major sections</tspan><tspan x="675" dy="28">for subsequent evaluation.</tspan></text><rect x="475" y="374" width="400" height="34" fill="#EAF4F8"/><text x="675" y="398" class="footer"><tspan font-weight="700">Output:</tspan> Processed review text</text></g>
<g id="stage-3"><rect x="922" y="132" width="410" height="280" rx="9" fill="#FFFFFF" stroke="#173247" stroke-width="2.3"/><path d="M 931 132 H 1323 Q 1332 132 1332 141 V 183 H 922 V 141 Q 922 132 931 132" fill="#1178A7"/><text x="1127" y="166" class="heading">Step 3: Reference Targets</text><g transform="translate(1127 224)" class="ico"><path d="M -7 -18 l 7 -7 a 15 15 0 0 1 21 21 l -13 13 a 15 15 0 0 1 -21 0 M 7 18 l -7 7 a 15 15 0 0 1 -21 -21 l 13 -13 a 15 15 0 0 1 21 0"/></g><text x="1127" y="286" class="body"><tspan x="1127" dy="0">Resolve cited references to DOIs</tspan><tspan x="1127" dy="28">and identify targets meeting</tspan><tspan x="1127" dy="28">the retrievability criteria.</tspan></text><rect x="927" y="374" width="400" height="34" fill="#EAF4F8"/><text x="1127" y="398" class="footer"><tspan font-weight="700">Output:</tspan> 889 ceiling targets</text></g>
<g id="stage-4"><rect x="18" y="468" width="410" height="280" rx="9" fill="#FFFFFF" stroke="#173247" stroke-width="2.3"/><path d="M 27 468 H 419 Q 428 468 428 477 V 519 H 18 V 477 Q 18 468 27 468" fill="#1178A7"/><text x="223" y="502" class="heading">Step 4: Review Configuration</text><g transform="translate(223 560)" class="ico"><rect x="-20" y="-24" width="40" height="53" rx="3"/><rect x="-10" y="-30" width="20" height="12" rx="3"/><path d="M -10 -4 H 10 M -10 7 H 10 M -10 18 H 5"/></g><text x="223" y="622" class="body"><tspan x="223" dy="0">Generate PRISMA-inspired</tspan><tspan x="223" dy="28">review configurations and</tspan><tspan x="223" dy="28">validate terms against source text.</tspan></text><rect x="23" y="710" width="400" height="34" fill="#EAF4F8"/><text x="223" y="734" class="footer"><tspan font-weight="700">Output:</tspan> 14 configurations</text></g>
<g id="stage-5"><rect x="470" y="468" width="410" height="280" rx="9" fill="#FFFFFF" stroke="#173247" stroke-width="2.3"/><path d="M 479 468 H 871 Q 880 468 880 477 V 519 H 470 V 477 Q 470 468 479 468" fill="#1178A7"/><text x="675" y="502" class="heading">Step 5: Bibliographic Search</text><g transform="translate(675 560)" class="ico"><circle cx="-6" cy="-7" r="20"/><path d="M 9 9 L 29 29"/></g><text x="675" y="622" class="body"><tspan x="675" dy="0">Search five bibliographic sources</tspan><tspan x="675" dy="28">using 2,040 query–database runs</tspan><tspan x="675" dy="28">to retrieve candidate records.</tspan></text><rect x="475" y="710" width="400" height="34" fill="#EAF4F8"/><text x="675" y="734" class="footer"><tspan font-weight="700">Output:</tspan> 140,261 records</text></g>
<g id="stage-6"><rect x="922" y="468" width="410" height="280" rx="9" fill="#FFFFFF" stroke="#173247" stroke-width="2.3"/><path d="M 931 468 H 1323 Q 1332 468 1332 477 V 519 H 922 V 477 Q 922 468 931 468" fill="#1178A7"/><text x="1127" y="502" class="heading">Step 6: Abstract Ranking</text><g transform="translate(1127 560)" class="ico"><path d="M -28 27 H 31 M -24 27 V -4 H -10 V 27 M -2 27 V -16 H 12 V 27 M 20 27 V -28 H 30 V 27"/></g><text x="1127" y="622" class="body"><tspan x="1127" dy="0">Evaluate 10 ranking strategies</tspan><tspan x="1127" dy="28">using abstracts and metadata.</tspan><tspan x="1127" dy="28">Select top 1,000 per review.</tspan></text><rect x="927" y="710" width="400" height="34" fill="#EAF4F8"/><text x="1127" y="734" class="footer"><tspan font-weight="700">Output:</tspan> 14,000 candidates</text></g>
<g id="stage-7"><rect x="18" y="804" width="410" height="280" rx="9" fill="#FFFFFF" stroke="#173247" stroke-width="2.3"/><path d="M 27 804 H 419 Q 428 804 428 813 V 855 H 18 V 813 Q 18 804 27 804" fill="#1178A7"/><text x="223" y="838" class="heading">Step 7: Full-Text Processing</text><g transform="translate(223 896)" class="ico"><path d="M -20 -29 H 7 L 19 -17 V 29 H -20 Z M 7 -29 V -17 H 19 M 0 -9 V 16 M -10 7 L 0 17 L 10 7"/></g><text x="223" y="958" class="body"><tspan x="223" dy="0">Retrieve 10,416 valid PDFs</tspan><tspan x="223" dy="28">and apply hybrid full-text-aware</tspan><tspan x="223" dy="28">reranking to candidate pools.</tspan></text><rect x="23" y="1046" width="400" height="34" fill="#EAF4F8"/><text x="223" y="1070" class="footer"><tspan font-weight="700">Output:</tspan> Reranked candidate pools</text></g>
<g id="stage-8"><rect x="470" y="804" width="410" height="280" rx="9" fill="#FFFFFF" stroke="#173247" stroke-width="2.3"/><path d="M 479 804 H 871 Q 880 804 880 813 V 855 H 470 V 813 Q 470 804 479 804" fill="#1178A7"/><text x="675" y="838" class="heading">Step 8: Evidence-Card Synthesis</text><g transform="translate(675 896)" class="ico"><path d="M 0 -29 L 29 -13 L 0 3 L -29 -13 Z M -29 0 L 0 16 L 29 0 M -29 14 L 0 30 L 29 14"/></g><text x="675" y="958" class="body"><tspan x="675" dy="0">Select top 200 per review</tspan><tspan x="675" dy="28">and extract structured evidence</tspan><tspan x="675" dy="28">into article-level cards.</tspan></text><rect x="475" y="1046" width="400" height="34" fill="#EAF4F8"/><text x="675" y="1070" class="footer"><tspan font-weight="700">Output:</tspan> 2,800 evidence cards</text></g>
<g id="stage-9"><rect x="922" y="804" width="410" height="280" rx="9" fill="#FFFFFF" stroke="#173247" stroke-width="2.3"/><path d="M 931 804 H 1323 Q 1332 804 1332 813 V 855 H 922 V 813 Q 922 804 931 804" fill="#1178A7"/><text x="1127" y="838" class="heading">Step 9: Generate &amp; Evaluate</text><g transform="translate(1127 896)" class="ico"><path d="M -29 -29 V 29 H 29"/><path d="M -19 14 L -3 -4 L 10 7 L 26 -16"/><circle cx="-19" cy="14" r="3"/><circle cx="-3" cy="-4" r="3"/><circle cx="10" cy="7" r="3"/><circle cx="26" cy="-16" r="3"/></g><text x="1127" y="958" class="body"><tspan x="1127" dy="0">Generate 14 review articles</tspan><tspan x="1127" dy="28">and evaluate citation retention</tspan><tspan x="1127" dy="28">and document similarity.</tspan></text><rect x="927" y="1046" width="400" height="34" fill="#EAF4F8"/><text x="1127" y="1070" class="footer"><tspan font-weight="700">Output:</tspan> Reviews and metrics</text></g>
<rect x="18" y="1102" width="1314" height="36" rx="4" fill="#F2F7FA" stroke="#BFD3DE"/>
<text x="675" y="1126" text-anchor="middle" font-size="16"><tspan font-weight="700">Evaluation rule:</tspan> Reference-target DOIs are withheld from configuration, ranking, extraction and review writing.</text>
</svg>